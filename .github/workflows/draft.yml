name: AI下書き作成

on:
  workflow_dispatch:
    inputs:
      only:
        description: "対象の写真ファイル名（空なら下書きの無い写真すべて）"
        type: string
        default: ""
      force:
        description: "既存の下書きを作り直す"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pillow-heif
      - name: 下書き作成
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then F="--force"; else F=""; fi
          python main.py draft --only "$ONLY" $F
      - name: 保存
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add queue/
          git commit -m "draft: AI下書き" || exit 0
          git pull --rebase
          git push
