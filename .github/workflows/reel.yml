name: リール作成

on:
  workflow_dispatch:
    inputs:
      id:
        description: "リールID（reels/ の中のフォルダ名）"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 準備（動画編集ソフト・日本語フォント）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
          pip install -q pillow pyyaml
      - name: リールを作る
        env:
          REEL_ID: ${{ inputs.id }}
        run: python reel.py "$REEL_ID"
      - name: 保存
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add -A queue/ reels/
          git commit -m "reel: ${{ inputs.id }}" || exit 0
          git pull --rebase
          git push
