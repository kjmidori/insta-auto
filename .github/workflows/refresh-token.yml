name: Instagramトークン自動延長

on:
  schedule:
    - cron: "13 0 * * 1"   # 毎週月曜 9:13 JST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: トークン延長
        id: r
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: python main.py refresh-token

      - name: Secretを新しいトークンで更新
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set IG_ACCESS_TOKEN --body "${{ steps.r.outputs.token }}" --repo "${{ github.repository }}"
